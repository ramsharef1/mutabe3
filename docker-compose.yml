version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_STRAPI_URL=http://localhost:1337
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
      - strapi
    networks:
      - mutabe3-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mutabe3-postgres
    environment:
      POSTGRES_USER: mutabe3_user
      POSTGRES_PASSWORD: mutabe3_dev_password
      POSTGRES_DB: mutabe3
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutabe3_user -d mutabe3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mutabe3-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mutabe3-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mutabe3-network

  # Strapi CMS (Optional for early dev - can be local Node process)
  strapi:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.strapi.dev
    container_name: mutabe3-strapi
    ports:
      - "1337:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: mutabe3
      DATABASE_USERNAME: mutabe3_user
      DATABASE_PASSWORD: mutabe3_dev_password
      JWT_SECRET: strapi_dev_secret_key_change_in_prod
      ADMIN_JWT_SECRET: strapi_admin_dev_secret_key_change_in_prod
      NODE_ENV: development
      API_TOKEN_SALT: strapi_api_token_salt_change_in_prod
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mutabe3-network

  # Node.js Backend API (if separate from Strapi)
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    container_name: mutabe3-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://mutabe3_user:mutabe3_dev_password@postgres:5432/mutabe3
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-key-change-in-prod
      NODE_ENV: development
      STRAPI_URL: http://strapi:1337
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mutabe3-network

volumes:
  postgres_data:
  redis_data:

networks:
  mutabe3-network:
    driver: bridge
