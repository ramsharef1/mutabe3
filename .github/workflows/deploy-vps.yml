name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:      # manual re-deploy: gh workflow run deploy-vps.yml

# The production app is a git checkout at
# /var/www/mutabe3/current/projects/mutabe3 run by the systemd units
# mutabe3-frontend (next start, :9100) and mutabe3-backend (:9080).
# Deploy = ssh in, fast-forward to origin/main, build the frontend, restart.
# Since D-079 (PLAN Q12, SECURITY S-07) deploys log in as the unprivileged mutabe3-deploy user, who owns
# the checkout: git, npm ci, prisma and the builds run without root. Its only sudo is the fixed helper
# `mutabe3-deploy-helper prepare|finish` (.next ownership + restarting the two mutabe3 units).
# One-time server config (UPLOAD_DIR, nginx body limit) and the D-045 image backfill moved out of deploys:
# both are applied; re-run them through ops-vps.yml (administrator key) if ever needed.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_DEPLOY_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned SSH host keys (D-073, SECURITY S-07) — printed by `gh workflow run ops-vps.yml -f action=host-keys`.
          # Any other key is refused. If the server is rebuilt, run that action and update these lines in
          # deploy-vps.yml, ops-vps.yml and monitor.yml.
          printf '%s\n' \
            'mutabe3-vps ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGG2Sri3vi9/vqAC5HoKTm3nXUjNBuGlwHacrxmaZtTy' \
            'mutabe3-vps ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBAfJ7KoLJYJH0FvDD0C5ifccXWAryWK0ppWOLVfxS/fhq9LvZNp41JzJNNcyg2jNMNCsJlrN5GT2XMrbnL3LnSQ=' > ~/.ssh/known_hosts_pinned
          SSH_PIN="-o HostKeyAlias=mutabe3-vps -o UserKnownHostsFile=$HOME/.ssh/known_hosts_pinned -o StrictHostKeyChecking=yes"

          ssh $SSH_PIN -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [ "$(id -un)" != root ] || { echo "❌ deploys must not run as root (D-079)"; exit 1; }
          cd /var/www/mutabe3/current/projects/mutabe3
          # Build with the same runtime the units run on (D-055: Node 22 under /opt/node22; the shared global node is left alone).
          [ -x /opt/node22/bin/node ] && export PATH=/opt/node22/bin:$PATH

          echo "== Fetching origin/main =="
          git fetch --quiet origin main
          # Prod was historically updated with `git checkout origin/main -- <paths>`,
          # which leaves tracked files dirty and makes `merge --ff-only` refuse.
          # Refuse only if prod has commits of its own; otherwise hard-sync to main
          # (untracked files — .env, node_modules, .next, uploads — are untouched).
          if git merge-base --is-ancestor HEAD origin/main; then
            git reset --hard --quiet origin/main
          else
            echo "❌ prod checkout has local commits not on origin/main — refusing to clobber"; exit 1
          fi

          echo "== Installing dependencies (lockfile, D-051) =="
          npm ci --no-audit --no-fund
          # The image pipeline (D-045) needs sharp's prebuilt libvips for this platform; fail here,
          # before anything restarts, rather than at the first upload.
          node -v
          node -e "const s=require('sharp'); console.log('sharp', s.versions.sharp, '· libvips', s.versions.vips, '· webp', !!s.format.webp.output.buffer)"

          echo "== Database schema (additive push + client generate) =="
          # Prisma reads DATABASE_URL from the service's env file (D-037/D-040). `db push`
          # refuses anything that would lose data, so a destructive schema change fails
          # the deploy here instead of silently breaking the API.
          # Subshell so the backend's env (PORT, NODE_ENV, …) never leaks into the frontend build.
          (
            set -a; . /etc/mutabe3/backend.env; set +a
            npx prisma db push --schema=packages/backend/prisma/schema.prisma --skip-generate
            npx prisma generate --schema=packages/backend/prisma/schema.prisma
          )

          echo "== Building backend (tsc → packages/backend/dist, D-049) =="
          npm run build --workspace=packages/backend

          echo "== Building frontend =="
          sudo -n /usr/local/sbin/mutabe3-deploy-helper prepare
          # Optional build-time frontend env (NEXT_PUBLIC_* such as the GTM id, D-055): /etc/mutabe3/frontend.env.
          # Subshell so nothing leaks into the restart below.
          ( [ -f /etc/mutabe3/frontend.env ] && { set -a; . /etc/mutabe3/frontend.env; set +a; echo "frontend env: $(grep -c '^[A-Z]' /etc/mutabe3/frontend.env) vars"; }
            npm run build --workspace=packages/frontend )
          echo "== Restarting services (helper: .next → service user, restart both units) =="
          sudo -n /usr/local/sbin/mutabe3-deploy-helper finish

          echo "== Deployed $(git rev-parse --short HEAD) =="
          REMOTE

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_DEPLOY_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned SSH host keys (D-073, SECURITY S-07) — printed by `gh workflow run ops-vps.yml -f action=host-keys`.
          # Any other key is refused. If the server is rebuilt, run that action and update these lines in
          # deploy-vps.yml, ops-vps.yml and monitor.yml.
          printf '%s\n' \
            'mutabe3-vps ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGG2Sri3vi9/vqAC5HoKTm3nXUjNBuGlwHacrxmaZtTy' \
            'mutabe3-vps ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBAfJ7KoLJYJH0FvDD0C5ifccXWAryWK0ppWOLVfxS/fhq9LvZNp41JzJNNcyg2jNMNCsJlrN5GT2XMrbnL3LnSQ=' > ~/.ssh/known_hosts_pinned
          SSH_PIN="-o HostKeyAlias=mutabe3-vps -o UserKnownHostsFile=$HOME/.ssh/known_hosts_pinned -o StrictHostKeyChecking=yes"

          ssh $SSH_PIN -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          # Both units restart as the unprivileged service user (D-048); the backend's `tsx watch`
          # cold start can take 10–20 s, so poll instead of sampling once.
          wait_for() { for i in $(seq 1 15); do code=$(curl -s -o /dev/null -w '%{http_code}' "$2" || true); [ "$code" = 200 ] && { echo "$1 HTTP 200 (after ${i} tries)"; return 0; }; sleep 3; done; echo "$1 HTTP ${code:-000} after 45s"; return 1; }
          wait_for "frontend (:9100)" http://localhost:9100 || { echo "❌ frontend health check failed"; exit 1; }
          wait_for "backend (:9080)"  http://localhost:9080/api/health || { echo "❌ backend health check failed"; systemctl status mutabe3-backend --no-pager -l | tail -15; exit 1; }
          REMOTE
