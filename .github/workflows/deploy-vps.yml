name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch: {}   # manual re-deploy: gh workflow run deploy-vps.yml

# The production app is a git checkout at
# /var/www/mutabe3/current/projects/mutabe3 run by the systemd units
# mutabe3-frontend (next start, :9100) and mutabe3-backend (:9080).
# Deploy = ssh in, fast-forward to origin/main, build the frontend, restart.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/mutabe3/current/projects/mutabe3

          echo "== Fetching origin/main =="
          git fetch --quiet origin main
          # Prod was historically updated with `git checkout origin/main -- <paths>`,
          # which leaves tracked files dirty and makes `merge --ff-only` refuse.
          # Refuse only if prod has commits of its own; otherwise hard-sync to main
          # (untracked files — .env, node_modules, .next, uploads — are untouched).
          if git merge-base --is-ancestor HEAD origin/main; then
            git reset --hard --quiet origin/main
          else
            echo "❌ prod checkout has local commits not on origin/main — refusing to clobber"; exit 1
          fi

          echo "== One-time server config (idempotent) =="
          # Editor image uploads live outside the checkout (D-039).
          grep -q '^UPLOAD_DIR=' /etc/mutabe3/backend.env || echo 'UPLOAD_DIR=/var/www/mutabe3/uploads' >> /etc/mutabe3/backend.env
          mkdir -p /var/www/mutabe3/uploads
          SVC_USER=$(systemctl show -p User --value mutabe3-backend); [ -n "$SVC_USER" ] && chown -R "$SVC_USER" /var/www/mutabe3/uploads
          # nginx defaults to 1MB request bodies; photos need more. The mutabe3 server
          # blocks live in /etc/nginx/conf.d/all-domains.conf, shared with other sites
          # that already set client_max_body_size, so key off our own marker comment
          # and only look at real *.conf files (not the .bak/.new copies beside them).
          MARK='# mutabe3-upload-limit'
          NGX=$(grep -l 'server_name[^;]*mutabe3\.news' /etc/nginx/conf.d/*.conf /etc/nginx/sites-enabled/* 2>/dev/null | head -1 || true)
          if [ -n "$NGX" ] && ! grep -qF "$MARK" "$NGX"; then
            BAK="$NGX.bak.$(date +%s)"; cp "$NGX" "$BAK"
            sed -i "/server_name[^;]*mutabe3\.news[^;]*;/a\\    client_max_body_size 25m; $MARK" "$NGX"
            if nginx -t; then
              systemctl reload nginx && echo "nginx: client_max_body_size 25m added to $NGX"
            else
              cp "$BAK" "$NGX"; echo "⚠️  nginx -t failed after edit; restored $NGX from $BAK"
            fi
          fi

          echo "== Installing dependencies =="
          npm install --no-audit --no-fund

          echo "== Database schema (additive push + client generate) =="
          # Prisma reads DATABASE_URL from the service's env file (D-037/D-040). `db push`
          # refuses anything that would lose data, so a destructive schema change fails
          # the deploy here instead of silently breaking the API.
          # Subshell so the backend's env (PORT, NODE_ENV, …) never leaks into the frontend build.
          (
            set -a; . /etc/mutabe3/backend.env; set +a
            npx prisma db push --schema=packages/backend/prisma/schema.prisma --skip-generate
            npx prisma generate --schema=packages/backend/prisma/schema.prisma
          )

          echo "== Building frontend =="
          npm run build --workspace=packages/frontend

          echo "== Restarting services =="
          systemctl restart mutabe3-frontend
          systemctl restart mutabe3-backend || true

          echo "== Deployed $(git rev-parse --short HEAD) =="
          REMOTE

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          curl -fsS -o /dev/null -w "frontend (:9100) HTTP %{http_code}\n" http://localhost:9100 \
            || { echo "❌ frontend health check failed"; exit 1; }
          curl -fsS -o /dev/null -w "backend (:9080) HTTP %{http_code}\n" http://localhost:9080/api/articles \
            || echo "⚠️  backend health check inconclusive"
          REMOTE
