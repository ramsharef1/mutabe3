name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/deploy-vps.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker buildx build -t mutabe3-frontend:latest packages/frontend -f packages/frontend/Dockerfile.dev
          docker buildx build -t mutabe3-backend:latest packages/backend -f packages/backend/Dockerfile.dev
          docker buildx build -t mutabe3-strapi:latest packages/backend -f packages/backend/Dockerfile.strapi.dev

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # Create SSH key file
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Add VPS to known_hosts
          ssh-keyscan -p $VPS_PORT -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          # SSH to VPS and deploy
          ssh -i ~/.ssh/id_ed25519 -p $VPS_PORT $VPS_USER@$VPS_HOST << 'EOF'
          set -e

          echo "=== Deploying mutabe3 ==="

          # Navigate to project directory
          cd /var/www/mutabe3/current

          # Pull latest code
          echo "Pulling latest code..."
          git pull origin main

          # Stop running containers
          echo "Stopping services..."
          docker-compose down || true

          # Build and start services
          echo "Building and starting services..."
          docker-compose up -d --build

          # Wait for services to be ready
          sleep 10

          # Run database migrations
          echo "Running database migrations..."
          docker-compose exec -T backend npm run db:migrate || true

          # Check if seed is needed
          echo "Checking database seed..."
          docker-compose exec -T backend npm run db:seed || true

          echo "✅ Deployment complete!"
          echo "Frontend: http://localhost:3100"
          echo "API: http://localhost:8080"

          # Show container status
          echo ""
          echo "Container status:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p $VPS_PORT -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          # Check if services are running
          ssh -i ~/.ssh/id_ed25519 -p $VPS_PORT $VPS_USER@$VPS_HOST << 'EOF'
          cd /var/www/mutabe3/current

          echo "Checking services health..."
          docker-compose ps

          # Try to connect to frontend
          if curl -f http://localhost:3100 > /dev/null 2>&1; then
            echo "✅ Frontend is responding"
          else
            echo "❌ Frontend health check failed"
            exit 1
          fi

          # Try to connect to API
          if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
            echo "✅ API is responding"
          else
            echo "⚠️  API health check inconclusive"
          fi
          EOF

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
