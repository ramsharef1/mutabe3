name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/deploy-vps.yml'

# The production app is a git checkout at
# /var/www/mutabe3/current/projects/mutabe3 run by the systemd units
# mutabe3-frontend (next start, :9100) and mutabe3-backend (:9080).
# Deploy = ssh in, fast-forward to origin/main, build the frontend, restart.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/mutabe3/current/projects/mutabe3

          echo "== Fetching origin/main =="
          git fetch --quiet origin main
          # ff-only: refuse (don't clobber) if prod ever has local commits.
          git merge --ff-only origin/main

          echo "== Installing dependencies =="
          npm install --no-audit --no-fund

          echo "== Building frontend =="
          npm run build --workspace=packages/frontend

          echo "== Restarting services =="
          systemctl restart mutabe3-frontend
          systemctl restart mutabe3-backend || true

          echo "== Deployed $(git rev-parse --short HEAD) =="
          REMOTE

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          curl -fsS -o /dev/null -w "frontend (:9100) HTTP %{http_code}\n" http://localhost:9100 \
            || { echo "❌ frontend health check failed"; exit 1; }
          curl -fsS -o /dev/null -w "backend (:9080) HTTP %{http_code}\n" http://localhost:9080/api/articles \
            || echo "⚠️  backend health check inconclusive"
          REMOTE
